# BookOrbit + pgvector Postgres (adapted from upstream docker-compose.yml). Secrets in .env.
# Data persists: Postgres in the bookorbit-db volume, app data in ./data, books in ./books.
services:
  bookorbit-db:
    container_name: bookorbit-db
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [bookorbit-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  bookorbit-app:
    container_name: bookorbit-app
    image: ghcr.io/bookorbit/bookorbit:latest
    restart: unless-stopped
    init: true
    depends_on: { bookorbit-db: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_HOST: bookorbit-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PODCAST_ENCRYPTION_KEY: ${PODCAST_ENCRYPTION_KEY}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN}
      APP_URL: https://books.daoseeking.duckdns.org:8443
      CLIENT_URL: https://books.daoseeking.duckdns.org:8443
      TZ: Asia/Tbilisi
      PUID: "1000"
      PGID: "1000"
      NODE_MAX_OLD_SPACE_SIZE: "2048"
    volumes:
      - ./books:/books
      - ./data:/data
      - "/home/sergey/data/d1/sergey/The Prince of Tennis (2012-2013) (Digital) (Shellshock):/books/The Prince of Tennis (Manga):ro"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

volumes:
  bookorbit-db: { name: bookorbit-db }   # fixed name: compose would otherwise prefix it with the project
