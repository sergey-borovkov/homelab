# Home DNS: LAN devices (router DHCP hands out 192.168.1.216 as DNS) resolve the homelab
# names to this PC directly -- the TP-Link router has no NAT loopback.
no-resolv
no-hosts
listen-address=192.168.1.216
bind-interfaces
address=/daoseeking.duckdns.org/192.168.1.216
# no-hosts means /etc/hosts is ignored: answer localhost ourselves (Caddy tripped on this)
address=/localhost/127.0.0.1
server=1.1.1.1
server=9.9.9.9
cache-size=10000
